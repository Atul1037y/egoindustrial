# @package _global_
_target_: egoindustrial.inference.tensorrt_engine.build_tensorrt_engine

onnx_path: ${paths.output_root}/model.onnx
engine_path: ${paths.output_root}/model_int8.engine
precision: int8  # fp32, fp16, int8
max_batch_size: 32
max_workspace_size: 1073741824  # 1GB
calibration_cache: ${paths.output_root}/calibration.cache
input_shapes:
  video:
    min: [1, 3, 16, 224, 224]
    opt: [16, 3, 16, 224, 224]
    max: [32, 3, 16, 224, 224]