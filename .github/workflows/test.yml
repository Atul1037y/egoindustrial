name: Test

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libglib2.0-0 libsm6 libxext6 libxrender-dev libgl1 \
            ffmpeg libavcodec-extra

      - name: Install dependencies
        run: |
          pip install -e ".[dev]"

      - name: Verify package import
        run: |
          python -c "import egoindustrial.data; import egoindustrial.models; import egoindustrial.training; import egoindustrial.inference; print('All imports OK')"

      - name: Run tests
        run: |
          pytest tests/ -v --cov=src/egoindustrial --cov-report=xml --cov-report=term-missing

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          fail_ci_if_error: false