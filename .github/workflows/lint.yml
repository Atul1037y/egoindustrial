name: Lint

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libglib2.0-0 libsm6 libxext6 libxrender-dev libgl1 \
            ffmpeg libavcodec-extra

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -e ".[dev]"
          pip install pandas-stubs types-PyYAML types-tqdm types-psutil || true
          pre-commit install

      - name: Verify package import
        run: |
          python -c "import egoindustrial.data; import egoindustrial.models; import egoindustrial.training; import egoindustrial.inference; print('All imports OK')"

      - name: Run Ruff
        run: ruff check .

      - name: Run Ruff format check
        run: ruff format --check .

      - name: Run MyPy
        run: mypy --install-types --non-interactive src/egoindustrial || echo "mypy completed with warnings"
        continue-on-error: true

      - name: Run pre-commit
        run: pre-commit run --all-files
